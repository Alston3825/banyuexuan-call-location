<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>护士站大屏</title>
<style>
:root{--bg:#0f1720;--panel:#18222e;--line:#263444;--text:#e8eef5;--mute:#8a9bb0;--ok:#3ecf8e;--warn:#f5a524;--bad:#ff4d4f;--blue:#4c9aff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:20px;padding:10px 20px;background:#0b1118;border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0;font-weight:600}
header .sp{flex:1}
.pill{padding:3px 12px;border-radius:99px;background:var(--panel);color:var(--mute);font-size:14px}
.pill.bad{background:var(--bad);color:#fff}
.pill.ok{color:var(--ok)}
button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 14px;font-size:14px;cursor:pointer}
#clock{font-variant-numeric:tabular-nums;font-size:20px}
main{flex:1;display:grid;grid-template-columns:1fr 380px;gap:14px;padding:14px;min-height:0}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0}
section h2{margin:0;padding:12px 16px;font-size:16px;font-weight:600;border-bottom:1px solid var(--line);color:var(--mute);display:flex;gap:10px;align-items:center}
section h2 b{color:var(--text);font-size:22px}
.body{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0}
.left{display:grid;grid-template-rows:minmax(0,2fr) minmax(0,1fr);gap:14px;min-height:0}
.card{border:1px solid var(--line);border-left:8px solid var(--warn);border-radius:10px;padding:12px 16px;background:#1d2937;display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:center}
.card .room{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums}
.card .room small{display:block;font-size:13px;color:var(--mute);font-weight:400}
.card .what{font-size:22px;font-weight:600}
.card .sub{color:var(--mute);font-size:14px;margin-top:2px}
.card .timer{font-size:30px;font-variant-numeric:tabular-nums;text-align:right}
.card .st{font-size:14px;margin-top:2px;text-align:right}
.card.pending{border-left-color:var(--warn)}
.card.claimed{border-left-color:var(--blue)}
.card.arrived{border-left-color:var(--ok)}
.card.emergency{border-left-color:var(--bad);background:#3a1a1e;animation:flash 1s infinite}
.card.late .timer{color:var(--bad)}
@keyframes flash{50%{background:#5a1f26}}
.vbox{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.vbtn{background:#24456b;border-color:#3a6aa5;font-size:15px;padding:6px 14px}
.vbtn.playing{background:var(--blue);color:#06101c}
.vtxt{flex-basis:100%;background:#0f1720;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:20px;line-height:1.5;cursor:pointer}
.vtxt.err{color:var(--warn);font-size:15px}
.vtxt.load{color:var(--mute);font-size:15px}
.empty{color:var(--mute);text-align:center;padding:30px 0}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border-bottom:0}
.dbl{cursor:pointer;user-select:none}.dbl:hover{background:#1d2937}
.tl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:16px;margin:10px 0}
.tl b{font-variant-numeric:tabular-nums;color:var(--mute);font-weight:400}
.hh{color:var(--mute);font-size:13px;margin:12px 0 2px;border-bottom:1px solid var(--line)}
.row .t{font-size:14px;color:var(--mute)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--mute)}
.dot.on{background:var(--ok)}.dot.busy{background:var(--blue)}.dot.off{background:#4a5666}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute);margin-left:6px}
.tag.bad{color:var(--bad);border-color:var(--bad)}
.rooms{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid var(--line);font-size:13px}
.rm{padding:2px 8px;border-radius:6px;background:#1d2937;color:var(--ok)}
.rm.off{background:#3a1a1e;color:var(--bad)}
#err{display:none;background:var(--bad);color:#fff;text-align:center;padding:6px;font-weight:600}
@media (max-width:900px){main{grid-template-columns:1fr;overflow:auto}body{overflow:auto;height:auto}}
</style>
</head>
<body>
<div id="hostwarn" style="display:none;background:#b26a00;color:#fff;text-align:center;padding:6px;font-weight:600"></div>
<div id="err">与主机失去连接,画面可能不是最新的</div>
<header>
  <h1>护士站 · <span id="store">—</span></h1>
  <span class="pill" id="cnt">—</span>
  <span class="sp"></span>
  <span class="pill" id="hostinfo" title="主机最近一次数据库备份时间与磁盘剩余空间"></span>
  <button id="snd">🔔 启用声音提醒</button>
  <button id="gb">自定义按钮</button>
  <button id="rb">按钮接收岗位</button>
  <button id="key">设置密钥</button>
  <span id="clock"></span>
</header>
<main>
  <div class="left">
    <section><h2>进行中的呼叫 <b id="n-active">0</b></h2><div class="body" id="active"></div></section>
    <section><h2>最近已结束</h2><div class="body" id="recent"></div></section>
  </div>
  <section>
    <h2>护理师 <b id="n-nurse">0</b></h2>
    <div class="body" id="nurses"></div>
    <div class="rooms" id="rooms"></div>
  </section>
</main>
<dialog id="dlg" style="background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:360px">
  <h3 style="margin:0 0 4px">自定义按钮</h3>
  <div class="t" style="color:var(--mute);font-size:14px;margin-bottom:12px">按这位客户的需要设置 1 个自定义按钮(最多 8 个字),显示在平板第 6 格;留空则不显示。客户换人后自动失效。默认发给护理师,可在“按钮接收岗位”里改。</div>
  <label>房间 <select id="g-room" style="font-size:16px"></select></label>
  <div style="margin:12px 0"><input id="g-1" maxlength="8" placeholder="自定义按钮文字(最多 8 个字,可留空)" style="width:100%;font-size:18px;padding:6px"></div>
  <div id="g-msg" style="min-height:20px;color:var(--warn);font-size:14px"></div>
  <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px"><button id="g-cancel">关闭</button><button id="g-save" style="background:var(--blue);border-color:var(--blue)">保存并推送到平板</button></div>
</dialog>
<dialog id="cdlg" style="background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:420px;max-width:640px">
  <div id="c-body"></div>
  <div style="display:flex;justify-content:flex-end;margin-top:10px"><button id="c-close">关闭</button></div>
</dialog>
<dialog id="ndlg" style="background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:460px;max-width:680px;max-height:80vh;overflow:auto">
  <div id="n-body"></div>
  <div style="display:flex;justify-content:flex-end;margin-top:10px"><button id="n-close">关闭</button></div>
</dialog>
<dialog id="rdlg" style="background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:380px">
  <h3 style="margin:0 0 4px">按钮接收岗位</h3>
  <div class="t" style="color:var(--mute);font-size:14px;margin-bottom:12px">选择每个按钮的呼叫由哪个岗位的手表接收。默认都是护理师。紧急呼叫固定发给护理师。岗位和员工的岗位在门店配置里设置。</div>
  <div id="r-list"></div>
  <div id="r-msg" style="min-height:20px;color:var(--warn);font-size:14px;margin-top:8px"></div>
  <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px"><button id="r-cancel">关闭</button><button id="r-save" style="background:var(--blue);border-color:var(--blue)">保存</button></div>
</dialog>
<script>
const $ = id => document.getElementById(id);
const STATE = {pending: '待接单', claimed: '已接单,前往中', arrived: '已到场处理中', completed: '已完成', cancelled: '已取消'};
const LATE_SECONDS = 30;     // 超过即标红(试行值,与主机升级时间保持一致)
let skew = 0, seen = null, soundOn = false, ctx = null, snap = null, lastOk = 0;

function getKey() {
  const q = new URLSearchParams(location.search).get('key');
  if (q) { try { localStorage.setItem('bycall_key', q); } catch (e) {} history.replaceState(null, '', location.pathname); }
  try { return localStorage.getItem('bycall_key') || ''; } catch (e) { return ''; }
}
function askKey() {
  const k = prompt('请输入主机 API 密钥', getKey());
  if (k !== null) { try { localStorage.setItem('bycall_key', k.trim()); } catch (e) {} poll(); }
}
$('key').onclick = askKey;
$('snd').onclick = () => {
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  soundOn = !soundOn; $('snd').textContent = soundOn ? '🔔 声音已开启' : '🔔 启用声音提醒';
  if (soundOn) beep(1);
};
function beep(n, urgent) {
  if (!soundOn || !ctx) return;
  for (let i = 0; i < n; i++) {
    const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i * 0.35;
    o.frequency.value = urgent ? 1100 : 760; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    o.start(t); o.stop(t + 0.28);
  }
}
// 主机故障提醒音:与呼叫提示音区分(低-高-低 三声),新故障出现立刻响,未解决则每 5 分钟再响一次
let warnSeen = new Set(), warnLast = 0;
function alarm() {
  if (!soundOn || !ctx) return;
  [520, 880, 520].forEach((f, i) => {
    const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i * 0.45;
    o.type = 'square'; o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
    o.start(t); o.stop(t + 0.4);
  });
}
function hostAlarm(problems) {
  const cur = new Set(problems), fresh = problems.some(p => !warnSeen.has(p));
  if (problems.length && (fresh || Date.now() - warnLast > 300000)) { alarm(); warnLast = Date.now(); }
  if (!problems.length) warnLast = 0;
  warnSeen = cur;
}
const now = () => Date.now() + skew;
function fmtDur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000)), m = Math.floor(s / 60);
  return String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function hhmm(iso) {
  if (!iso) return '';
  const d = new Date(iso); return d.toLocaleTimeString('zh-CN', {hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit'});
}
function hhmmDate(ms) { const d = new Date(ms); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.toLocaleTimeString('zh-CN', {hour12: false, hour: '2-digit', minute: '2-digit'}); }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

// ---- 语音留言:播放 + 转文字(状态放全局,界面每 2 秒刷新也不丢) ----
const STT = {};                     // 录音名 -> {state:'load'|'ok'|'err', text}
let audio = null, playingName = null;
const vname = c => (c.voice_url || '').split('/').pop();
function rerender() { render(snap); if (typeof refreshDlgs === 'function') refreshDlgs(); }
async function playVoice(c) {
  const name = vname(c);
  if (audio && playingName === name) { audio.pause(); audio = null; playingName = null; rerender(); return; }
  if (audio) { audio.pause(); audio = null; }
  playingName = name; rerender();
  try {
    const r = await fetch(c.voice_url, {headers: {'X-Api-Key': getKey()}});
    if (!r.ok) throw new Error(r.status);
    const a = new Audio(URL.createObjectURL(await r.blob()));
    a.onended = () => { if (audio === a) { audio = null; playingName = null; rerender(); } };
    audio = a; await a.play();
  } catch (e) { audio = null; playingName = null; STT[name] = {state: 'err', text: '播放失败:' + (e.message || e) + '(浏览器可能需要先点一下页面)'}; rerender(); }
}
async function transcribeVoice(c) {
  const name = vname(c);
  if (STT[name] && STT[name].state === 'load') return;
  STT[name] = {state: 'load'}; rerender();
  try {
    const r = await fetch('/voice/' + encodeURIComponent(name) + '/transcribe', {method: 'POST', headers: {'X-Api-Key': getKey()}});
    const j = await r.json();
    STT[name] = r.ok ? {state: 'ok', text: j.text} : {state: 'err', text: j.detail || ('失败 ' + r.status)};
  } catch (e) { STT[name] = {state: 'err', text: '与主机连接失败'}; }
  rerender();
}
function voiceBox(c) {
  const name = vname(c), st = STT[name], box = el('div', 'vbox');
  const play = el('button', 'vbtn' + (playingName === name ? ' playing' : ''), playingName === name ? '■ 停止播放' : '▶ 播放留言');
  play.onpointerdown = e => { e.preventDefault(); playVoice(c); };
  const tr = el('button', 'vbtn', '📝 转文字'); tr.onpointerdown = e => { e.preventDefault(); transcribeVoice(c); };
  const text = c.transcript != null ? c.transcript : (st && st.state === 'ok' ? st.text : null);
  box.appendChild(play);
  if (text == null) box.appendChild(tr);
  if (text != null) { const t = el('div', 'vtxt', text); t.title = '点击复制'; t.onpointerdown = () => navigator.clipboard && navigator.clipboard.writeText(text); box.appendChild(t); }
  else if (st && st.state === 'load') box.appendChild(el('div', 'vtxt load', '正在转文字,约几秒钟…'));
  else if (st && st.state === 'err') box.appendChild(el('div', 'vtxt err', st.text));
  return box;
}

function callCard(c) {
  const d = el('div', 'card ' + c.state + (c.priority === 'emergency' ? ' emergency' : ''));
  d.dataset.created = c.created_at || ''; d.dataset.state = c.state;
  const room = el('div', 'room', c.room); room.appendChild(el('small', null, c.floor ? c.floor + ' 层' : ''));
  const mid = el('div');
  mid.appendChild(el('div', 'what', (c.priority === 'emergency' ? '🚨 ' : '') + (c.label || '呼叫') + (c.voice_url ? ' 🎤语音留言' : '')));
  const who = c.state === 'pending' ? '尚无人接单' : (c.owner_name || c.owner || '') + (c.state === 'arrived' ? ' 已到场' : ' 正在前往');
  mid.appendChild(el('div', 'sub', (c.text ? c.text + ' · ' : '') + who + ' · ' + hhmm(c.created_at) + ' 发出'));
  if (c.voice_url) mid.appendChild(voiceBox(c));
  const right = el('div');
  const timer = el('div', 'timer', c.created_at ? fmtDur(now() - Date.parse(c.created_at)) : '');
  timer.className = 'timer t';
  right.appendChild(timer); right.appendChild(el('div', 'st', STATE[c.state] || c.state));
  d.append(room, mid, right);
  return d;
}
function tick() {
  $('clock').textContent = new Date().toLocaleTimeString('zh-CN', {hour12: false});
  document.querySelectorAll('#active .card').forEach(d => {
    if (!d.dataset.created) return;
    const ms = now() - Date.parse(d.dataset.created);
    d.querySelector('.t').textContent = fmtDur(ms);
    d.classList.toggle('late', d.dataset.state === 'pending' && ms > LATE_SECONDS * 1000);
  });
  $('err').style.display = (Date.now() - lastOk > 8000 && lastOk) ? 'block' : 'none';
}
function render(s) {
  snap = s;
  $('store').textContent = s.store_id;
  const hw = $('hostwarn'), hp = (s.host && s.host.problems) || [];
  hostAlarm(hp);
  hw.style.display = hp.length ? 'block' : 'none'; hw.textContent = hp.length ? '⚠ 主机提醒:' + hp.join(';') : '';
  const hs = s.host; $('hostinfo').textContent = '主机 v' + s.version + (hs ? ' · 备份 ' + (hs.backup_at ? hhmmDate(hs.backup_at * 1000) : '无') + (hs.disk_free_gb != null ? ' · 磁盘余 ' + hs.disk_free_gb + 'GB' : '') : '');
  const act = $('active'); act.replaceChildren();
  s.active.slice().sort((a, b) => (b.priority === 'emergency') - (a.priority === 'emergency')).forEach(c => act.appendChild(callCard(c)));
  if (!s.active.length) act.appendChild(el('div', 'empty', '当前没有待处理的呼叫'));
  $('n-active').textContent = s.active.length;
  const pend = s.active.filter(c => c.state === 'pending').length;
  const cnt = $('cnt'); cnt.textContent = pend ? pend + ' 个待接单' : '全部已有人处理';
  cnt.className = 'pill ' + (pend ? 'bad' : 'ok');

  const rc = $('recent'); rc.replaceChildren();
  s.recent.forEach(c => {
    const r = el('div', 'row dbl'); r.dataset.callId = c.call_id; r.title = '双击查看详情'; const l = el('div');
    l.appendChild(el('div', null, c.room + ' · ' + (c.label || '呼叫') + (c.state === 'cancelled' ? '(已取消)' : '')));
    l.appendChild(el('div', 't', (c.owner_name ? c.owner_name + ' · ' : '') + hhmm(c.created_at) + ' → ' + hhmm(c.ended_at)));
    const dur = c.created_at && c.ended_at ? fmtDur(Date.parse(c.ended_at) - Date.parse(c.created_at)) : '';
    r.append(l, el('div', 't', dur)); rc.appendChild(r);
  });
  if (!s.recent.length) rc.appendChild(el('div', 'empty', '暂无记录'));

  const nu = $('nurses'); nu.replaceChildren();
  const order = n => (n.online ? 0 : 1) * 2 + (n.active.length ? 0 : 1);
  s.nurses.slice().sort((a, b) => order(a) - order(b) || a.name.localeCompare(b.name)).forEach(n => {
    const r = el('div', 'row dbl'); r.dataset.staff = n.staff; r.title = '双击查看该护理师的呼叫记录'; const l = el('div');
    const h = el('div'); const dot = el('span', 'dot ' + (!n.online ? 'off' : n.active.length ? 'busy' : 'on'));
    h.append(dot, n.name);
    if (!n.online) h.appendChild(el('span', 'tag bad', '离线'));
    else if (n.active.length) h.appendChild(el('span', 'tag', '处理 ' + n.active.map(a => a.room).join('、')));
    else h.appendChild(el('span', 'tag', '空闲'));
    l.appendChild(h);
    const loc = n.online ? (n.area || '位置未知') : ('最后在线 ' + (hhmm(n.last_seen) || '—'));
    l.appendChild(el('div', 't', loc + (n.heart_rate ? ' · ♥ ' + n.heart_rate : '')));
    const bat = el('div', 't', n.battery != null ? '🔋' + n.battery + '%' : '');
    if (n.battery != null && n.battery < 20) bat.style.color = 'var(--bad)';
    r.append(l, bat); nu.appendChild(r);
  });
  $('n-nurse').textContent = s.nurses.filter(n => n.online).length + '/' + s.nurses.length;

  const rm = $('rooms'); rm.replaceChildren();
  s.rooms.slice().sort((a, b) => a.online - b.online || a.room.localeCompare(b.room)).forEach(r => {
    const x = el('span', 'rm' + (r.online ? '' : ' off'), r.room + (r.online ? '' : ' 平板离线'));
    x.title = r.battery != null ? '电量 ' + r.battery + '%' : ''; rm.appendChild(x);
  });

  // 新呼叫提示音;紧急呼叫响得更急
  const ids = new Set(s.active.map(c => c.call_id));
  if (seen) {
    const fresh = s.active.filter(c => !seen.has(c.call_id));
    if (fresh.some(c => c.priority === 'emergency')) beep(6, true); else if (fresh.length) beep(2);
  }
  seen = ids;
}
async function poll() {
  const key = getKey();
  try {
    const r = await fetch('/station/snapshot', {headers: {'X-Api-Key': key}, cache: 'no-store'});
    if (r.status === 401) { lastOk = 0; $('err').textContent = '密钥不对或未设置,点右上角“设置密钥”'; $('err').style.display = 'block'; return; }
    if (!r.ok) throw new Error(r.status);
    const s = await r.json();
    skew = Date.parse(s.now) - Date.now(); lastOk = Date.now();
    $('err').textContent = '与主机失去连接,画面可能不是最新的';
    render(s);
  } catch (e) { /* 保留旧画面,由 tick() 超时后显示断线横幅 */ }
}

// ---- 双击:已结束呼叫详情 / 护理师累积记录 ----
const KIND = {'call.created': '呼叫发出', 'call.claim': '接单', 'call.arrive': '到场', 'call.complete': '完成', 'call.cancel': '取消', 'call.transfer': '转交'};
const SN = {completed: '已完成', cancelled: '已取消', claimed: '处理中', arrived: '已到场', pending: '待接单'};
const fullTime = iso => iso ? new Date(iso).toLocaleString('zh-CN', {hour12: false, month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit'}) : '';
let dlgCall = null, dlgStaff = null;
async function getJson(url) {
  const r = await fetch(url, {headers: {'X-Api-Key': getKey()}, cache: 'no-store'});
  if (!r.ok) throw new Error(r.status); return r.json();
}
function renderCallDlg() {
  const c = dlgCall, b = $('c-body'); b.replaceChildren();
  if (!c) return;
  b.appendChild(el('div', null, (c.emergency ? '🚨 ' : '') + c.room_no + ' 房  ' + (c.label || '呼叫'))).style.cssText = 'font-size:26px;font-weight:700';
  b.appendChild(el('div', 't', (SN[c.state] || c.state) + (c.owner_name ? ' · 接单人:' + c.owner_name : ''))).style.cssText = 'color:var(--mute);margin-top:2px';
  const tl = el('div', 'tl');
  (c.timeline || []).forEach(e => { tl.append(el('b', null, fullTime(e.at)), el('span', null, KIND[e.kind] || e.kind)); });
  if (c.created_at && c.ended_at) tl.append(el('b', null, '总用时'), el('span', null, fmtDur(Date.parse(c.ended_at) - Date.parse(c.created_at))));
  b.appendChild(tl);
  if (c.text) b.appendChild(el('div', null, '留言:' + c.text)).style.cssText = 'font-size:18px;margin:6px 0';
  if (c.voice_url) b.appendChild(voiceBox(c));
}
async function openCall(id) {
  try { dlgCall = await getJson('/station/call/' + encodeURIComponent(id)); } catch (e) { return; }
  renderCallDlg(); if (!$('cdlg').open) $('cdlg').showModal();
}
function renderStaffDlg() {
  const d = dlgStaff, b = $('n-body'); b.replaceChildren();
  if (!d) return;
  const today = new Date().toDateString();
  const isToday = c => c.created_at && new Date(c.created_at).toDateString() === today;
  const items = d.items, tn = items.filter(isToday).length;
  b.appendChild(el('div', null, d.name + ' 的呼叫记录')).style.cssText = 'font-size:24px;font-weight:700';
  b.appendChild(el('div', 't', '今天 ' + tn + ' 条 · 累计 ' + items.length + ' 条')).style.cssText = 'color:var(--mute);margin:2px 0 8px';
  const group = (title, list) => {
    if (!list.length) return;
    b.appendChild(el('div', 'hh', title));
    list.forEach(c => {
      const r = el('div', 'row dbl'); r.dataset.callId = c.call_id;
      const l = el('div'); l.appendChild(el('div', null, (c.emergency ? '🚨 ' : '') + c.room_no + ' · ' + (c.label || '呼叫') + (c.voice_url ? ' 🎤' : '')));
      l.appendChild(el('div', 't', fullTime(c.created_at) + ' · ' + (SN[c.state] || c.state)));
      r.append(l, el('div', 't', c.created_at && c.ended_at ? fmtDur(Date.parse(c.ended_at) - Date.parse(c.created_at)) : '')); b.appendChild(r);
    });
  };
  group('今天', items.filter(isToday)); group('更早', items.filter(c => !isToday(c)));
  if (!items.length) b.appendChild(el('div', 'empty', '还没有记录'));
}
async function openStaff(id) {
  try { dlgStaff = await getJson('/station/staff/' + encodeURIComponent(id) + '/history'); } catch (e) { return; }
  renderStaffDlg(); if (!$('ndlg').open) $('ndlg').showModal();
}
function refreshDlgs() { if ($('cdlg').open) renderCallDlg(); }
$('c-close').onclick = () => { $('cdlg').close(); dlgCall = null; };
$('cdlg').addEventListener('close', () => { dlgCall = null; });
$('n-close').onclick = () => $('ndlg').close();
$('ndlg').addEventListener('close', () => { dlgStaff = null; });
$('ndlg').ondblclick = e => { const r = e.target.closest('[data-call-id]'); if (r) openCall(r.dataset.callId); };
$('recent').ondblclick = e => { const r = e.target.closest('[data-call-id]'); if (r) openCall(r.dataset.callId); };
$('nurses').ondblclick = e => { const r = e.target.closest('[data-staff]'); if (r) openStaff(r.dataset.staff); };
setInterval(poll, 2000); setInterval(tick, 1000);
function fillGuest() {
  const r = (snap && snap.rooms || []).find(x => x.room === $('g-room').value);
  const g = r ? r.guest_buttons : [];
  $('g-1').value = g[0] || ''; $('g-msg').textContent = '';
}
$('gb').onclick = () => {
  if (!snap) return;
  const sel = $('g-room'); sel.replaceChildren();
  snap.rooms.slice().sort((a, b) => a.room.localeCompare(b.room, 'zh', {numeric: true})).forEach(r => {
    const o = el('option', null, (r.room_no || r.room) + (r.guest_buttons.length ? '  (已设置 ' + r.guest_buttons.length + ')' : '')); o.value = r.room; sel.appendChild(o);
  });
  fillGuest(); $('dlg').showModal();
};
$('g-room').onchange = fillGuest;
$('g-cancel').onclick = () => $('dlg').close();
$('g-save').onclick = async () => {
  const labels = [$('g-1').value].map(x => x.trim()).filter(Boolean);
  const r = await fetch('/rooms/' + encodeURIComponent($('g-room').value) + '/buttons', {method: 'PUT',
    headers: {'X-Api-Key': getKey(), 'Content-Type': 'application/json'}, body: JSON.stringify({labels})});
  if (r.ok) { $('g-msg').style.color = 'var(--ok)'; $('g-msg').textContent = '已保存,平板马上更新'; poll(); }
  else { $('g-msg').style.color = 'var(--warn)'; $('g-msg').textContent = r.status === 400 ? (await r.json()).detail : '保存失败(' + r.status + ')'; }
};
let rview = null;
$('rb').onclick = async () => {
  const r = await fetch('/routing', {headers: {'X-Api-Key': getKey()}});
  if (!r.ok) { alert('读取失败(' + r.status + ')'); return; }
  rview = await r.json(); const box = $('r-list'); box.replaceChildren();
  rview.items.forEach(it => {
    const row = el('div', null); row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:17px';
    row.appendChild(el('span', null, it.label));
    const sel = el('select', null); sel.dataset.code = it.code; sel.style.fontSize = '16px';
    rview.roles.forEach(ro => { const o = el('option', null, ro.name + (ro.people.length ? '(' + ro.people.length + '人)' : '(暂无人员)')); o.value = ro.id; if (ro.id === it.role) o.selected = true; sel.appendChild(o); });
    row.appendChild(sel); box.appendChild(row);
  });
  $('r-msg').textContent = ''; $('rdlg').showModal();
};
$('r-cancel').onclick = () => $('rdlg').close();
$('r-save').onclick = async () => {
  const body = {}; $('r-list').querySelectorAll('select').forEach(s => body[s.dataset.code] = s.value);
  const r = await fetch('/routing', {method: 'PUT', headers: {'X-Api-Key': getKey(), 'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  if (r.ok) { $('r-msg').style.color = 'var(--ok)'; $('r-msg').textContent = '已保存,新呼叫立即按此发送'; }
  else { $('r-msg').style.color = 'var(--warn)'; $('r-msg').textContent = r.status === 400 ? (await r.json()).detail : '保存失败(' + r.status + ')'; }
};
if (!getKey()) askKey(); else poll();
</script>
</body>
</html>
