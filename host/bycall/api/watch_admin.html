<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>护士站换表</title><style>body{font:17px system-ui;max-width:1100px;margin:auto;padding:20px;background:#f4f5f7;color:#182535}button,input,select{font:inherit;padding:10px;margin:5px}section{background:white;padding:16px;margin:15px 0;border-radius:10px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #ddd}.warn{color:#9b4800}pre{white-space:pre-wrap}button{cursor:pointer}</style>
<h1>护士站换表</h1><section id="login"><label>换表管理员凭据 <input id="key" type="password" autocomplete="off"></label><button id="enter">登录</button></section>
<p id="notice" role="status"></p><div id="content" hidden><p class="warn" id="sync"></p><section><label>查找员工 <input id="search" placeholder="姓名 / 工号"></label><select id="staff"></select><pre id="context"></pre>
<label>备用表 SN / 扫码枪输入 <input id="sn" autocomplete="off"></label><label><input type="checkbox" id="fault">原表故障</label><br>
<button id="swap">确认换表</button><button id="back">切回原表</button><button id="undo">撤销当日上次换绑</button><button id="release">下班归还</button></section>
<section><h2 id="poolTitle">备用池</h2><div id="pool"></div></section><section><h2>操作记录（只读）</h2><div id="logs"></div></section><button id="logout">退出</button></div>
<script>
let token='',snap=null,busy=false;const $=id=>document.getElementById(id);const text=(id,t)=>$(id).textContent=t;
async function api(path,body){const r=await fetch('/watch-admin/'+path,{method:body?'POST':'GET',headers:{'X-Watch-Admin-Key':token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.detail||'请求失败');return d}
function current(){return snap?.staff.find(s=>s.staff_id===$('staff').value)}
function context(){const s=current();text('context',s?`${s.name} (${s.staff_id}) · ${s.on_duty?'在班':'不在班'}\n当前表：${s.binding?.sn||'未佩戴'}；原表：${s.binding?.original||'—'}\n班次：${s.business_date} ${s.shift}；服务房间：${s.served_rooms.join('、')}\n未闭环事件：${s.open_events}`:'请选择员工')}
function filter(){const prior=$('staff').value; $('staff').replaceChildren();snap.staff.filter(s=>(s.name+s.staff_id).includes($('search').value)).forEach(s=>{const o=new Option(s.name+' / '+s.staff_id,s.staff_id);$('staff').add(o)});if([...$('staff').options].some(o=>o.value===prior))$('staff').value=prior;context()}
function table(id,rows,columns){const t=document.createElement('table');const tr=document.createElement('tr');columns.forEach(c=>{const th=document.createElement('th');th.textContent=c[0];tr.append(th)});t.append(tr);rows.forEach(r=>{const tr=document.createElement('tr');columns.forEach(c=>{const td=document.createElement('td');td.textContent=c[1](r)??'—';tr.append(td)});t.append(tr)});$(id).replaceChildren(t)}
async function refresh(){try{snap=await api('snapshot');$('content').hidden=false;$('login').hidden=true;text('sync',snap.sync_message);filter();text('poolTitle',`备用池：可用 ${snap.available} 块${snap.shortage?' · 备用表不足':''}`);table('pool',snap.inventory,[['SN',w=>w.sn],['状态',w=>w.state],['电量',w=>w.battery==null?'未知':w.battery+'%'],['网络',w=>w.online?'在线':'离线'],['可借',w=>w.eligible?'是':'否'],['最近擦除',w=>w.reset_at]]);snap.inventory.forEach(w=>{if(w.staff)return;const b=document.createElement('button');b.textContent='清空 / 复检 '+w.sn;b.onclick=()=>reset(w.sn);$('pool').append(b);const fault=document.createElement('button');fault.textContent='标记故障 '+w.sn;fault.onclick=async()=>{const note=prompt('故障原因');if(!note)return;try{await api('fault',{sn:w.sn,note});await refresh()}catch(e){text('notice',e.message)}};$('pool').append(fault)});table('logs',snap.operations,[['时间',r=>r.at],['员工',r=>r.staff],['操作',r=>r.action],['原表 → 新表',r=>(r.from_sn||'—')+' → '+(r.to_sn||'—')],['操作员',r=>r.operator],['同步',r=>r.sync_status]])}catch(e){text('notice',e.message)}}
async function change(action){if(busy)return;const s=current();if(!s?.binding)return text('notice','员工没有绑定档案');const target=$('sn').value.trim();if(action==='SWAP'&&!snap.inventory.some(w=>w.sn===target&&w.eligible))return text('notice','新表不可借：请核对状态、电量、在线及信号');if(!confirm(`${s.name}：${action==='SWAP'?'换入 '+target:action==='RELEASE'?'归还当前表':'切回原表'}；服务房间 ${s.served_rooms.length} 个，未闭环事件 ${s.open_events} 条。确认？`))return;busy=true;try{await api('change',{staff:s.staff_id,target,action,version:s.binding.version,request_id:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),fault:$('fault').checked});text('notice','本地绑定已更新；请确认新表已显示员工及呼叫再上岗');await refresh()}catch(e){text('notice',e.message)}finally{busy=false}}
async function reset(sn){if(!confirm('确认清空 '+sn+' 的个人数据？设备确认前不能借出。'))return;try{await api('reset',{sn});await refresh()}catch(e){text('notice',e.message)}}
$('enter').onclick=()=>{token=$('key').value;$('key').value='';refresh()};$('logout').onclick=()=>{token='';snap=null;$('content').hidden=true;$('login').hidden=false};$('search').oninput=filter;$('staff').onchange=context;['swap','back','release','undo'].forEach((id,i)=>$(id).onclick=()=>change(['SWAP','ROLLBACK','RELEASE','UNDO'][i]));setInterval(()=>{if(token&&!busy)refresh()},10000);
</script></html>
