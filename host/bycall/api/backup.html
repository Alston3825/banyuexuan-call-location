<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>备份与恢复 · 伴月轩呼叫系统</title>
<style>
:root{--bg:#f6f4f1;--card:#fff;--tx:#2b2724;--mu:#8a817a;--ac:#8b5e3c;--ok:#2e7d4f;--bad:#c0392b;--ln:#e6e0da}
@media(prefers-color-scheme:dark){:root{--bg:#1d1b19;--card:#27241f;--tx:#eee8e2;--mu:#a39a92;--ln:#3a352f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang SC",sans-serif}
main{max-width:880px;margin:0 auto;padding:16px}h1{font-size:20px;margin:8px 0 14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.kv{flex:1 1 180px}.kv b{display:block;font-size:12px;color:var(--mu);font-weight:400}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mu{color:var(--mu)}
button{border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer}
button.ghost{background:transparent;color:var(--ac)}button.danger{background:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5}input[type=text],input[type=number]{border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:8px;padding:6px 9px;font-size:14px}
table{width:100%;border-collapse:collapse}td,th{padding:7px 4px;border-bottom:1px solid var(--ln);text-align:left;font-size:14px}th{color:var(--mu);font-weight:400;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--ln);border-radius:14px;padding:2px 4px 2px 10px;margin:2px}
.chip a{cursor:pointer;color:var(--mu);padding:0 6px}#msg{position:sticky;top:0;z-index:5}
.banner{padding:10px 14px;border-radius:10px;margin-bottom:12px;background:#fdecea;color:#8a1f12}
dialog{border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx);max-width:420px}
</style></head><body><main>
<h1>备份与恢复</h1>
<div id="msg"></div>

<div class="card"><h2>状态</h2><div class="row" id="st"></div>
<div class="row" style="margin-top:12px"><button id="runBtn" onclick="runNow()">立即备份一次</button>
<span class="mu" id="runMsg"></span></div></div>

<div class="card"><h2>自动备份设置</h2>
<div style="margin-bottom:8px"><label><input type="checkbox" id="auto"> 开启定时自动备份</label>
&nbsp;&nbsp;<label><input type="checkbox" id="cloud"> 同时上传云端(加密)</label></div>
<div>每天备份时间(门店时间,可添加多个):<span id="times"></span>
<input type="text" id="newTime" placeholder="如 12:30" size="7"> <button class="ghost" onclick="addTime()">添加</button></div>
<div style="margin:10px 0">本地保留 <input type="number" id="lk" min="1" max="3650" style="width:70px"> 天 &nbsp;
云端保留 <input type="number" id="ck" min="1" max="3650" style="width:70px"> 天 <span class="mu">(最新一份永远保留)</span></div>
<button onclick="saveSettings()">保存设置</button></div>

<div class="card"><h2>云端备份 <span class="mu" id="cn"></span></h2><div id="cloudlist"></div></div>
<div class="card"><h2>本机备份 <span class="mu" id="ln"></span></h2><div id="locallist"></div></div>

<dialog id="dlg"><h3 style="margin-top:0">恢复到这份备份?</h3>
<p id="dtxt"></p>
<p class="bad">恢复会让主机重启(约 20 秒),期间呼叫不可用;这份备份之后产生的数据会丢失(当前数据库会改名保留在主机上,不会删除)。</p>
<p>请输入“恢复”两个字确认:<br><input type="text" id="conf" size="10"></p>
<div class="row" style="justify-content:flex-end"><button class="ghost" onclick="pick=null;dlg.close()">取消</button><button class="danger" id="goBtn" onclick="doRestore()">确认恢复</button></div></dialog>
</main>
<script>
const q=new URLSearchParams(location.search);let KEY=q.get('key');
try{if(KEY)localStorage.setItem('bycall_key',KEY);else KEY=localStorage.getItem('bycall_key')}catch(e){}
let S=null,TIMES=[],pick=null,inited=false;const $=id=>document.getElementById(id);
async function api(p,o={}){const r=await fetch(p,{...o,headers:{'X-Api-Key':KEY||'','Content-Type':'application/json'}});
 const t=await r.text();let j={};try{j=JSON.parse(t)}catch(e){}
 if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:(r.status===401?'密钥不对,请在地址后加 ?key=密钥':t.slice(0,120)));return j}
function flash(t,bad){$('msg').innerHTML=t?`<div class="banner" style="${bad?'':'background:#e7f4ec;color:#1d5a37'}">${t}</div>`:''; if(t)setTimeout(()=>{$('msg').innerHTML=''},6000)}
const fmt=ts=>ts?new Date(ts*1000).toLocaleString('zh-CN',{hour12:false}):'—';
const mb=b=>(b/1048576).toFixed(b<1048576?2:1)+' MB';
function ago(ts){if(!ts)return'—';const m=(Date.now()/1000-ts)/60;return m<60?Math.round(m)+' 分钟前':(m/60).toFixed(1)+' 小时前'}
async function load(){try{
 S=await api('/backup/status');const L=await api('/backup/list');
 let cs=!S.cloud_configured?'<span class="mu">未配置云存储</span>':!S.cloud_ready?'<span class="bad">缺少加密口令</span>':S.cloud_error?`<span class="bad">失败:${S.cloud_error}</span>`:S.settings.cloud?'<span class="ok">正常</span>':'<span class="mu">已关闭</span>';
 $('st').innerHTML=`<div class="kv"><b>最近一次本机备份</b>${ago(S.last_run)}${S.last_error?`<br><span class="bad">${S.last_error}</span>`:''}</div>
 <div class="kv"><b>最近一次云端上传成功</b>${ago(S.cloud_ok_at)}${S.pending?` <span class="mu">(待传 ${S.pending} 份)</span>`:''}</div><div class="kv"><b>云备份</b>${cs}</div>`;
 if(!inited){inited=true;TIMES=[...S.settings.times];$('auto').checked=S.settings.auto;$('cloud').checked=S.settings.cloud;$('lk').value=S.settings.local_keep_days;$('ck').value=S.settings.cloud_keep_days;drawTimes()}
 $('cn').textContent=L.cloud.length+' 份';$('ln').textContent=L.local.length+' 份';
 $('cloudlist').innerHTML=L.cloud_list_error?`<span class="bad">读取云端失败:${L.cloud_list_error}</span>`:tbl(L.cloud,'cloud');
 $('locallist').innerHTML=tbl(L.local,'local');
}catch(e){flash(e.message,1)}}
function tbl(a,src){if(!a.length)return'<span class="mu">暂无</span>';
 return '<table><tr><th>文件</th><th>时间</th><th>大小</th><th></th></tr>'+a.slice(0,60).map(f=>`<tr><td>${f.name}</td><td>${fmt(f.mtime)}</td><td>${mb(f.size)}</td><td><button class="ghost" onclick="ask('${src}','${f.name}')">恢复</button></td></tr>`).join('')+'</table>'}
function drawTimes(){$('times').innerHTML=TIMES.map((t,i)=>`<span class="chip">${t}<a onclick="TIMES.splice(${i},1);drawTimes()">✕</a></span>`).join('')}
function addTime(){const v=$('newTime').value.trim();if(!/^\d{1,2}:\d{2}$/.test(v))return flash('时间格式如 12:30',1);TIMES.push(v);$('newTime').value='';drawTimes()}
async function saveSettings(){try{await api('/backup/settings',{method:'PUT',body:JSON.stringify({times:TIMES,auto:$('auto').checked,cloud:$('cloud').checked,local_keep_days:+$('lk').value,cloud_keep_days:+$('ck').value})});flash('已保存');load()}catch(e){flash(e.message,1)}}
async function runNow(){$('runBtn').disabled=true;$('runMsg').textContent='备份中…';try{const r=await api('/backup/run',{method:'POST',body:'{}'});$('runMsg').textContent='';flash('备份完成:'+r.file+(r.cloud?'(已上传云端)':''));}catch(e){$('runMsg').textContent='';flash(e.message,1)}$('runBtn').disabled=false;load()}
function ask(src,name){pick={src,name};$('dtxt').innerHTML=`来源:<b>${src==='cloud'?'云端':'本机'}</b><br>文件:<b>${name}</b>`;$('conf').value='';dlg.showModal()}
async function doRestore(){if($('conf').value.trim()!=='恢复')return flash('请输入“恢复”两个字确认',1);$('goBtn').disabled=true;
 try{const r=await api('/backup/restore',{method:'POST',body:JSON.stringify({source:pick.src,name:pick.name,confirm:'恢复'})});dlg.close();flash(r.message);waitBack()}catch(e){flash(e.message,1);$('goBtn').disabled=false}}
function waitBack(){let n=0;const t=setInterval(async()=>{n++;try{const r=await fetch('/health');if(r.ok&&n>3){clearInterval(t);pick=null;flash('主机已重启并恢复完成');load()}}catch(e){}if(n>60)clearInterval(t)},2000)}
load();setInterval(()=>{if(!dlg.open)load()},15000);
</script></body></html>
