<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>主机更新</title>
<style>
:root{--bg:#080d17;--bg-2:#0c1320;--panel:#101928;--panel-2:#152033;--panel-3:#1a2740;--line:rgba(148,170,200,.12);--line-2:rgba(148,170,200,.22);--text:#e8eef7;--mute:#93a1b6;--faint:#5f6f86;--brand:#e9c77b;--blue:#5ea8ff;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--ok-bg:rgba(52,211,153,.10);--warn-bg:rgba(251,191,36,.10);--bad-bg:rgba(248,113,113,.10);--blue-bg:rgba(94,168,255,.10);--font:"PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","WenQuanYi Zen Hei",-apple-system,system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 85% -10%,rgba(94,168,255,.07),transparent 60%),var(--bg);color:var(--text);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
a{color:#9ccaff}
button{font:inherit;font-size:14px;color:var(--text);background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;min-height:36px;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,border-color .15s}
button:hover{background:var(--panel-3);border-color:rgba(148,170,200,.32)}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri,button.primary{background:var(--blue);border-color:var(--blue);color:#04101f;font-weight:700}
button.pri:hover,button.primary:hover{background:#7ab8ff}
input,select,textarea{font:inherit;font-size:15px;color:var(--text);background:var(--bg-2);border:1px solid var(--line-2);border-radius:8px;min-height:38px;padding:6px 12px;outline:none;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(94,168,255,.18)}
input[type=checkbox]{min-height:0;width:16px;height:16px;accent-color:var(--blue)}
.topbar{position:sticky;top:0;z-index:5;height:64px;display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid var(--line);background:rgba(10,16,27,.92);backdrop-filter:blur(8px)}
.mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#1c2a44,#111a2b);border:1px solid var(--line-2);flex-shrink:0}
.topbar h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.04em}
.topbar .desc{font-size:12px;color:var(--faint);margin:0}
.topbar .sp{flex:1}
.topbar a.back{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);color:var(--text);text-decoration:none;font-size:14px;background:var(--panel-2)}
.topbar a.back:hover{border-color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{position:sticky;top:0;background:var(--panel);color:var(--faint);font-weight:600;font-size:12px;letter-spacing:.06em;white-space:nowrap;z-index:1}
tbody tr:hover td{background:rgba(255,255,255,.02)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line-2);border-radius:18px;padding:24px 26px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
dialog::backdrop{background:rgba(3,7,14,.66);backdrop-filter:blur(4px)}



main{max-width:760px;margin:0 auto;padding:24px 18px}h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mute);margin-bottom:20px}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
h2{margin:0 0 6px;font-size:17px}.t{color:var(--mute);font-size:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
button{background:var(--blue);color:#04101f;border:0;border-radius:8px;padding:9px 18px;font-size:15px;font-weight:600;cursor:pointer}
button.g{background:var(--panel);color:var(--text);border:1px solid var(--line);font-weight:400}button:disabled{opacity:.45;cursor:default}
.bar{height:10px;background:var(--bg-2);border-radius:99px;overflow:hidden;margin-top:12px;display:none}.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}
.msg{margin-top:10px;min-height:22px}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
b.v{font-variant-numeric:tabular-nums;background:var(--bg-2);padding:2px 10px;border-radius:6px}
input[type=file]{color:var(--mute)}

header{position:sticky;top:0;z-index:5;min-height:64px;display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid var(--line);background:rgba(10,16,27,.92);backdrop-filter:blur(8px)}
header h1{font-size:19px;font-weight:700;letter-spacing:.04em;margin:0}
section{background:linear-gradient(180deg,rgba(21,32,51,.72),rgba(16,25,40,.72));border:1px solid var(--line);border-radius:16px;padding:20px 22px}
h2{font-size:12px;letter-spacing:.12em;color:var(--faint);font-weight:600;margin:0 0 12px}
main{padding:24px}
</style></head><body><header class="topbar"><div class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M15.5 3.2A9 9 0 1 0 20.8 15 7.2 7.2 0 0 1 15.5 3.2Z" fill="#e9c77b"/></svg></div><div><h1>主机更新</h1><p class="desc">在这里上传新版本,点一下就能更新主机,不用到主机旁边操作。</p></div></header><main>


<section>
  <h2>主机程序</h2>
  <div class="t">当前版本:<b class="v" id="hv">—</b>　<button class="g" id="refresh">刷新</button></div>
  <div class="t" style="margin-top:8px">选择开发者给你的 <b>bycall-host-amd64.tar.gz</b>,上传后会自动载入、换新版本。更新约 1~3 分钟,期间大屏会短暂断线(呼叫会在恢复后补上);新版本启动失败会自动换回旧版。</div>
  <div class="row"><input type="file" id="f-host" accept=".gz,.tar,.tgz"><button id="go-host">上传并更新</button></div>
  <div class="bar" id="bar-host"><i></i></div><div class="msg" id="msg-host"></div>
</section>

<section>
  <h2>语音识别模型(留言转文字)</h2>
  <div class="t">状态:<span id="mv">—</span>。只需要装一次,以后更新主机不用再传。选择 <b>bycall-models.tar.gz</b>(约 430MB)。</div>
  <div class="row"><input type="file" id="f-models" accept=".gz,.tar,.tgz"><button id="go-models">上传并安装</button></div>
  <div class="bar" id="bar-models"><i></i></div><div class="msg" id="msg-models"></div>
</section>
<div class="t">提示:更新器本身只在换新版本时才需要重装(很少),一般不用管。</div>
</main>
<script>
const $ = id => document.getElementById(id);
function key() { try { let k = localStorage.getItem('bycall_key'); if (!k) { k = prompt('请输入主机 API 密钥'); if (k) localStorage.setItem('bycall_key', k.trim()); } return (k || '').trim(); } catch (e) { return ''; } }
async function status() {
  const r = await fetch('/api/status', {headers: {'X-Api-Key': key()}, cache: 'no-store'});
  if (r.status === 401) { try { localStorage.removeItem('bycall_key'); } catch (e) {} throw new Error('密钥不对,请刷新页面重新输入'); }
  return r.json();
}
async function refresh() {
  try { const s = await status(); $('hv').textContent = s.host_version || '主机未响应';
    $('mv').textContent = s.models_installed ? '已安装(' + s.models_size_mb + 'MB)' : '未安装'; $('mv').className = s.models_installed ? 'ok' : 'warn'; return s; }
  catch (e) { $('hv').textContent = '—'; return null; }
}
function upload(kind, file, onprog) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest(); x.open('POST', '/api/upload/' + kind);
    x.setRequestHeader('X-Api-Key', key());
    x.upload.onprogress = e => e.lengthComputable && onprog(e.loaded / e.total);
    x.onload = () => x.status < 300 ? res() : rej(new Error((JSON.parse(x.responseText || '{}').detail) || ('失败 ' + x.status)));
    x.onerror = () => rej(new Error('网络中断')); x.send(file);
  });
}
async function go(kind) {
  const f = $('f-' + kind).files[0], bar = $('bar-' + kind), msg = $('msg-' + kind), btn = $('go-' + kind);
  if (!f) { msg.className = 'msg warn'; msg.textContent = '请先选择文件'; return; }
  btn.disabled = true; bar.style.display = 'block'; bar.firstElementChild.style.width = '0'; msg.className = 'msg'; msg.textContent = '正在上传…';
  try {
    await upload(kind, f, p => { bar.firstElementChild.style.width = (p * 100).toFixed(0) + '%'; msg.textContent = '正在上传 ' + (p * 100).toFixed(0) + '%'; });
    bar.firstElementChild.style.width = '100%';
    for (;;) {                                 // 轮询进度;主机重启期间更新器照常响应
      await new Promise(r => setTimeout(r, 2000));
      let s; try { s = await status(); } catch (e) { continue; }
      const j = s.job; msg.textContent = j.msg;
      if (j.stage === 'done') { msg.className = 'msg ok'; break; }
      if (j.stage === 'failed') { msg.className = 'msg bad'; break; }
    }
  } catch (e) { msg.className = 'msg bad'; msg.textContent = '失败:' + e.message; }
  btn.disabled = false; refresh();
}
$('go-host').onclick = () => go('host'); $('go-models').onclick = () => go('models'); $('refresh').onclick = refresh;
refresh();
</script></body></html>
