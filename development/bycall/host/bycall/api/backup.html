<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>备份与恢复 · 伴月轩呼叫系统</title>
<style>
:root{--bg:#080d17;--bg-2:#0c1320;--panel:#101928;--panel-2:#152033;--panel-3:#1a2740;--line:rgba(148,170,200,.12);--line-2:rgba(148,170,200,.22);--text:#e8eef7;--mute:#93a1b6;--faint:#5f6f86;--brand:#e9c77b;--blue:#5ea8ff;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--ok-bg:rgba(52,211,153,.10);--warn-bg:rgba(251,191,36,.10);--bad-bg:rgba(248,113,113,.10);--blue-bg:rgba(94,168,255,.10);--font:"PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","WenQuanYi Zen Hei",-apple-system,system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 85% -10%,rgba(94,168,255,.07),transparent 60%),var(--bg);color:var(--text);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
a{color:#9ccaff}
button{font:inherit;font-size:14px;color:var(--text);background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;min-height:36px;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,border-color .15s}
button:hover{background:var(--panel-3);border-color:rgba(148,170,200,.32)}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri,button.primary{background:var(--blue);border-color:var(--blue);color:#04101f;font-weight:700}
button.pri:hover,button.primary:hover{background:#7ab8ff}
input,select,textarea{font:inherit;font-size:15px;color:var(--text);background:var(--bg-2);border:1px solid var(--line-2);border-radius:8px;min-height:38px;padding:6px 12px;outline:none;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(94,168,255,.18)}
input[type=checkbox]{min-height:0;width:16px;height:16px;accent-color:var(--blue)}
.topbar{position:sticky;top:0;z-index:5;height:64px;display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid var(--line);background:rgba(10,16,27,.92);backdrop-filter:blur(8px)}
.mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#1c2a44,#111a2b);border:1px solid var(--line-2);flex-shrink:0}
.topbar h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.04em}
.topbar .desc{font-size:12px;color:var(--faint);margin:0}
.topbar .sp{flex:1}
.topbar a.back{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);color:var(--text);text-decoration:none;font-size:14px;background:var(--panel-2)}
.topbar a.back:hover{border-color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{position:sticky;top:0;background:var(--panel);color:var(--faint);font-weight:600;font-size:12px;letter-spacing:.06em;white-space:nowrap;z-index:1}
tbody tr:hover td{background:rgba(255,255,255,.02)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line-2);border-radius:18px;padding:24px 26px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
dialog::backdrop{background:rgba(3,7,14,.66);backdrop-filter:blur(4px)}

main{max-width:920px;margin:0 auto;padding:24px}
.card{background:linear-gradient(180deg,rgba(21,32,51,.72),rgba(16,25,40,.72));border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 14px;display:flex;gap:8px;align-items:baseline}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.kv{flex:1 1 180px;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.kv b{display:block;font-size:12px;color:var(--faint);font-weight:500;letter-spacing:.06em;margin-bottom:4px}
.mu{color:var(--faint)}
button{background:var(--blue);border-color:var(--blue);color:#04101f;font-weight:700}button:hover{background:#7ab8ff}
button.ghost{background:var(--panel-2);border-color:var(--line-2);color:var(--text);font-weight:400}button.ghost:hover{background:var(--panel-3)}
button.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;height:28px;border:1px solid var(--line-2);background:var(--panel-2);border-radius:99px;padding:0 4px 0 12px;margin:2px;font-variant-numeric:tabular-nums}
.chip a{cursor:pointer;color:var(--faint);padding:0 6px}.chip a:hover{color:var(--bad)}
#msg{position:sticky;top:72px;z-index:5}
.banner{padding:12px 16px;border-radius:12px;margin-bottom:14px;background:var(--bad-bg);border:1px solid rgba(248,113,113,.35);color:#ffc9c9}
dialog{max-width:440px}
label{color:var(--mute)}
</style></head><body><header class="topbar"><div class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M15.5 3.2A9 9 0 1 0 20.8 15 7.2 7.2 0 0 1 15.5 3.2Z" fill="#e9c77b"/></svg></div><div><h1>备份与恢复</h1><p class="desc">主机数据库的定时备份、云端副本与恢复</p></div></header><main>
<div id="msg"></div>

<div class="card"><h2>状态</h2><div class="row" id="st"></div>
<div class="row" style="margin-top:12px"><button id="runBtn" onclick="runNow()">立即备份一次</button>
<span class="mu" id="runMsg"></span></div></div>

<div class="card"><h2>自动备份设置</h2>
<div style="margin-bottom:8px"><label><input type="checkbox" id="auto"> 开启定时自动备份</label>
&nbsp;&nbsp;<label><input type="checkbox" id="cloud"> 同时上传云端(加密)</label></div>
<div>每天备份时间(门店时间,可添加多个):<span id="times"></span>
<input type="text" id="newTime" placeholder="如 12:30" size="7"> <button class="ghost" onclick="addTime()">添加</button></div>
<div style="margin:10px 0">本地保留 <input type="number" id="lk" min="1" max="3650" style="width:70px"> 天 &nbsp;
云端保留 <input type="number" id="ck" min="1" max="3650" style="width:70px"> 天 <span class="mu">(最新一份永远保留)</span></div>
<button onclick="saveSettings()">保存设置</button></div>

<div class="card"><h2>云端备份 <span class="mu" id="cn"></span></h2><div id="cloudlist"></div></div>
<div class="card"><h2>本机备份 <span class="mu" id="ln"></span></h2><div id="locallist"></div></div>

<dialog id="dlg"><h3 style="margin-top:0">恢复到这份备份?</h3>
<p id="dtxt"></p>
<p class="bad">恢复会让主机重启(约 20 秒),期间呼叫不可用;这份备份之后产生的数据会丢失(当前数据库会改名保留在主机上,不会删除)。</p>
<p>请输入“恢复”两个字确认:<br><input type="text" id="conf" size="10"></p>
<div class="row" style="justify-content:flex-end"><button class="ghost" onclick="pick=null;dlg.close()">取消</button><button class="danger" id="goBtn" onclick="doRestore()">确认恢复</button></div></dialog>
</main>
<script>
const q=new URLSearchParams(location.search);let KEY=q.get('key');
try{if(KEY)localStorage.setItem('bycall_key',KEY);else KEY=localStorage.getItem('bycall_key')}catch(e){}
let S=null,TIMES=[],pick=null,inited=false;const $=id=>document.getElementById(id);
async function api(p,o={}){const r=await fetch(p,{...o,headers:{'X-Api-Key':KEY||'','Content-Type':'application/json'}});
 const t=await r.text();let j={};try{j=JSON.parse(t)}catch(e){}
 if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:(r.status===401?'密钥不对,请在地址后加 ?key=密钥':t.slice(0,120)));return j}
function flash(t,bad){$('msg').innerHTML=t?`<div class="banner" style="${bad?'':'background:#e7f4ec;color:#1d5a37'}">${t}</div>`:''; if(t)setTimeout(()=>{$('msg').innerHTML=''},6000)}
const fmt=ts=>ts?new Date(ts*1000).toLocaleString('zh-CN',{hour12:false}):'—';
const mb=b=>(b/1048576).toFixed(b<1048576?2:1)+' MB';
function ago(ts){if(!ts)return'—';const m=(Date.now()/1000-ts)/60;return m<60?Math.round(m)+' 分钟前':(m/60).toFixed(1)+' 小时前'}
async function load(){try{
 S=await api('/backup/status');const L=await api('/backup/list');
 let cs=!S.cloud_configured?'<span class="mu">未配置云存储</span>':!S.cloud_ready?'<span class="bad">缺少加密口令</span>':S.cloud_error?`<span class="bad">失败:${S.cloud_error}</span>`:S.settings.cloud?'<span class="ok">正常</span>':'<span class="mu">已关闭</span>';
 $('st').innerHTML=`<div class="kv"><b>最近一次本机备份</b>${ago(S.last_run)}${S.last_error?`<br><span class="bad">${S.last_error}</span>`:''}</div>
 <div class="kv"><b>最近一次云端上传成功</b>${ago(S.cloud_ok_at)}${S.pending?` <span class="mu">(待传 ${S.pending} 份)</span>`:''}</div><div class="kv"><b>云备份</b>${cs}</div>`;
 if(!inited){inited=true;TIMES=[...S.settings.times];$('auto').checked=S.settings.auto;$('cloud').checked=S.settings.cloud;$('lk').value=S.settings.local_keep_days;$('ck').value=S.settings.cloud_keep_days;drawTimes()}
 $('cn').textContent=L.cloud.length+' 份';$('ln').textContent=L.local.length+' 份';
 $('cloudlist').innerHTML=L.cloud_list_error?`<span class="bad">读取云端失败:${L.cloud_list_error}</span>`:tbl(L.cloud,'cloud');
 $('locallist').innerHTML=tbl(L.local,'local');
}catch(e){flash(e.message,1)}}
function tbl(a,src){if(!a.length)return'<span class="mu">暂无</span>';
 return '<table><tr><th>文件</th><th>时间</th><th>大小</th><th></th></tr>'+a.slice(0,60).map(f=>`<tr><td>${f.name}</td><td>${fmt(f.mtime)}</td><td>${mb(f.size)}</td><td><button class="ghost" onclick="ask('${src}','${f.name}')">恢复</button></td></tr>`).join('')+'</table>'}
function drawTimes(){$('times').innerHTML=TIMES.map((t,i)=>`<span class="chip">${t}<a onclick="TIMES.splice(${i},1);drawTimes()">✕</a></span>`).join('')}
function addTime(){const v=$('newTime').value.trim();if(!/^\d{1,2}:\d{2}$/.test(v))return flash('时间格式如 12:30',1);TIMES.push(v);$('newTime').value='';drawTimes()}
async function saveSettings(){try{await api('/backup/settings',{method:'PUT',body:JSON.stringify({times:TIMES,auto:$('auto').checked,cloud:$('cloud').checked,local_keep_days:+$('lk').value,cloud_keep_days:+$('ck').value})});flash('已保存');load()}catch(e){flash(e.message,1)}}
async function runNow(){$('runBtn').disabled=true;$('runMsg').textContent='备份中…';try{const r=await api('/backup/run',{method:'POST',body:'{}'});$('runMsg').textContent='';flash('备份完成:'+r.file+(r.cloud?'(已上传云端)':''));}catch(e){$('runMsg').textContent='';flash(e.message,1)}$('runBtn').disabled=false;load()}
function ask(src,name){pick={src,name};$('dtxt').innerHTML=`来源:<b>${src==='cloud'?'云端':'本机'}</b><br>文件:<b>${name}</b>`;$('conf').value='';dlg.showModal()}
async function doRestore(){if($('conf').value.trim()!=='恢复')return flash('请输入“恢复”两个字确认',1);$('goBtn').disabled=true;
 try{const r=await api('/backup/restore',{method:'POST',body:JSON.stringify({source:pick.src,name:pick.name,confirm:'恢复'})});dlg.close();flash(r.message);waitBack()}catch(e){flash(e.message,1);$('goBtn').disabled=false}}
function waitBack(){let n=0;const t=setInterval(async()=>{n++;try{const r=await fetch('/health');if(r.ok&&n>3){clearInterval(t);pick=null;flash('主机已重启并恢复完成');load()}}catch(e){}if(n>60)clearInterval(t)},2000)}
load();setInterval(()=>{if(!dlg.open)load()},15000);
</script></body></html>
